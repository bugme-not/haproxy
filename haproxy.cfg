global
maxconn 65535
log stdout format raw local0

defaults
mode http
timeout connect 10s
timeout client 3600s
timeout server 3600s
timeout tunnel 3600s
option httplog

frontend main
bind :8080 proto h2c

acl is_root path /
acl is_index path /index.html
http-request return status 200 content-type "text/html" file /var/www/index.html if is_root or is_index

acl is_health path /health
http-request return status 200 content-type "text/plain" string "OK" if is_health

acl path_trojan_ws path_beg /CxlvinTRWS
acl path_trojan_hu path_beg /CxlvinTRHU
acl path_trojan_xh path_beg /CxlvinTRXH
acl path_trojan_grpc path_beg /cxlvintr-grpc

acl path_vmess_ws path_beg /CxlvinVMWS
acl path_vmess_hu path_beg /CxlvinVMHU
acl path_vmess_xh path_beg /CxlvinVMXH
acl path_vmess_grpc path_beg /cxlvinvm-grpc

acl path_vless_ws path_beg /CxlvinVlWS
acl path_vless_hu path_beg /CxlvinVlHU
acl path_vless_xh path_beg /CxlvinVlXH
acl path_vless_grpc path_beg /cxlvinvl-grpc

acl path_ss_ws path_beg /CxlvinSSWS
acl path_ss_hu path_beg /CxlvinSSHU
acl path_ss_xh path_beg /CxlvinSSXH
acl path_ss_grpc path_beg /cxlvinss-grpc

use_backend bk_12001_grpc if path_trojan_grpc
use_backend bk_12002_grpc if path_vmess_grpc
use_backend bk_12003_grpc if path_vless_grpc
use_backend bk_12004_grpc if path_ss_grpc

use_backend bk_10010 if path_trojan_xh
use_backend bk_10009 if path_vless_xh
use_backend bk_10012 if path_ss_xh
use_backend bk_10011 if path_vmess_xh

use_backend bk_11001 if path_trojan_hu
use_backend bk_11002 if path_vless_hu
use_backend bk_11003 if path_ss_hu
use_backend bk_11004 if path_vmess_hu

use_backend bk_10001 if path_trojan_ws
use_backend bk_10002 if path_vless_ws
use_backend bk_10003 if path_ss_ws
use_backend bk_10004 if path_vmess_ws

backend bk_10001
server s1 127.0.0.1:10001

backend bk_10002
server s1 127.0.0.1:10002

backend bk_10003
server s1 127.0.0.1:10003

backend bk_10004
server s1 127.0.0.1:10004

backend bk_11001
server s1 127.0.0.1:11001

backend bk_11002
server s1 127.0.0.1:11002

backend bk_11003
server s1 127.0.0.1:11003

backend bk_11004
server s1 127.0.0.1:11004

backend bk_10009
server s1 127.0.0.1:10009

backend bk_10010
server s1 127.0.0.1:10010

backend bk_10011
server s1 127.0.0.1:10011

backend bk_10012
server s1 127.0.0.1:10012

backend bk_12001_grpc
server s1 127.0.0.1:12001 proto h2

backend bk_12002_grpc
server s1 127.0.0.1:12002 proto h2

backend bk_12003_grpc
server s1 127.0.0.1:12003 proto h2

backend bk_12004_grpc
server s1 127.0.0.1:12004 proto h2

backend bk_12004_grpc
server s1 127.0.0.1:12004 proto h2
